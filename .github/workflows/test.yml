name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three full grids ran concurrently on main during the v2.1.0 release burst
# (the merge commit, semantic-release's `chore(release):` commit, and a ci
# commit, all inside six minutes), because this workflow had no group at all.
#
# cancel-in-progress is deliberately PR-ONLY. On a PR the newest push is the
# only one anyone reads, so killing the older run is free. On main it is NOT:
# a cancelled run leaves that commit with no recorded result, and this project
# treats the per-commit check board as evidence. Grouping without cancelling
# still fixes the burst -- the runs queue and execute one at a time instead of
# three abreast -- while every commit keeps its own verdict.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      # fetch-depth: 0 because tests/unit/test_run_manifest.py asserts on
      # `git describe --match 'v[0-9]*'`, which needs the tag AND the commit
      # graph back to it. The default shallow checkout (depth 1, no tags)
      # leaves git_describe None and fails four of those assertions.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      # The `bench` extra carries psutil, which src/aquacal/io/benchmark.py
      # needs to populate cpu_count_logical and ram_total_bytes. Without it
      # both degrade to None (by design, benchmark.py:151-159) and the
      # manifest field assertions fail.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      - name: Run tests
        run: pytest tests/ -m "not slow" --cov=aquacal --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  experiments-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run experiment smoke tests
        run: |
          python -m experiments.e1_refractive_comparison --smoke
          python -m experiments.e2_real_rig --smoke
          python -m experiments.e7_interface_ablation --smoke
          python -m experiments.e3_derived_quantities --smoke
          python -m experiments.e4_benchmark_grid --smoke
          python -m experiments.e5_index_sensitivity --smoke
          python -m experiments.e6_generalization_sweep --smoke
