repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.planning/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Generated artifacts whose provenance fields are high-entropy by design:
        # notebook outputs, the committed experiment results under
        # experiments/results/ (benchmark.json carries `git_sha`, calibration.json
        # carries `config_hash` -- both are recorded deliberately, and both are
        # regenerated with new values on every run, so a baseline entry cannot
        # hold), and the frozen numerical anchors under tests/fixtures/, whose
        # `provenance.sha` is the 40-hex commit the anchor was captured at. That
        # field is the whole point of the file -- it is what proves the anchor
        # predates the change it guards -- and it takes a new value on every
        # legitimate regeneration, so it has the same baseline problem.
        # None of these file types is a place credentials belong.
        # The results glob is `results[^/]*` rather than `results` so that
        # sibling output directories used to isolate a repeated sweep --
        # experiments/results_e6_repeat2/ is phase 19.3's paired determinism
        # run (D-19.3-20) -- inherit the same reasoning. They hold the same
        # artifact types, produced by the same code, with the same
        # regenerated-every-run `git_sha`.
        # The optional archive segment covers the two archive-aside moves, each
        # of which relocates the same trees, byte-identical, to a new path:
        #   pre_rerun_baseline/   Phase 26 / DRIVER-04 (D-28..D-32)
        #   freeze01_run_output/  Phase 29.1 / plan 29.1-06, the 2026-08-20 run
        # Without the segment the pure-rename commit trips this hook on ~200
        # `git_sha` and `config_hash` fields that were already committed and
        # already excluded at the old path. This is NOT hypothetical for the
        # second one: measured on 29.1-06's staged move, detect-secrets reported
        # Hex High Entropy String findings across the e6_configs records before
        # the segment was widened, and none after.
        # Each archive's purge drops its own alternative: Phase 30 / POST-03 for
        # pre_rerun_baseline/, and Phase 2 of the archive-stale-outputs todo for
        # freeze01_run_output/.
        exclude: ^(docs/tutorials/.*\.ipynb|experiments/(pre_rerun_baseline/|freeze01_run_output/)?results[^/]*/.*|tests/fixtures/.*\.json)$

  - repo: local
    hooks:
      - id: ruff-check-all
        name: Ruff lint all files
        entry: bash .hooks/pre-push-ruff-check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format-check-all
        name: Ruff format check all files
        entry: bash .hooks/pre-push-ruff-format.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      # The `pytest tests/ -m "not slow"` pre-push hook was removed 2026-08-20.
      # It duplicated .github/workflows/test.yml, which runs the same command on
      # 3.11/3.12 x ubuntu/windows for pushes to `main` and PRs into it. Locally
      # it cost ~50 min per push, which trained us out of pushing -- and this
      # repo has already paid for that once, when 674 unpushed commits turned two
      # trivial CI fixes into a release-day emergency. It also invoked bare
      # `python`, so it failed with ~62 collection errors whenever the conda env
      # was off PATH: an environment fault wearing a test-failure costume, and a
      # gate that cries wolf gets bypassed with --no-verify, which skips the two
      # ruff hooks above as well.
      #
      # Note the gap this leaves: test.yml triggers only on `main` and PRs into
      # it, so pushes to a long-lived branch like experiments/* now have no
      # automated test gate. If that stops being acceptable, widen test.yml's
      # push trigger rather than reinstating a slow local hook.
