repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.planning/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Generated artifacts whose provenance fields are high-entropy by design:
        # notebook outputs, and the committed experiment results under
        # experiments/results/ (benchmark.json carries `git_sha`, calibration.json
        # carries `config_hash` -- both are recorded deliberately, and both are
        # regenerated with new values on every run, so a baseline entry cannot
        # hold. Neither file type is a place credentials belong.
        exclude: ^(docs/tutorials/.*\.ipynb|experiments/results/.*)$

  - repo: local
    hooks:
      - id: ruff-check-all
        name: Ruff lint all files
        entry: bash .hooks/pre-push-ruff-check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format-check-all
        name: Ruff format check all files
        entry: bash .hooks/pre-push-ruff-format.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tests
        name: Run tests
        entry: bash .hooks/pre-push-tests.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
