repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.planning/
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # experiments/results/ holds the committed paper artifacts (EXP-04/05/06).
        # Two exceed 1000 KB at the manuscript's full frameset and BOTH must be
        # versioned: reprojection_residuals.csv (1.3 MB) is one of the three CSVs
        # the external figures repo reads, and calibration.json (2.2 MB) is the
        # run's primary artifact per D-15. The oversized *regenerable* outputs in
        # this directory (exp2_spatial_errors.csv, the conditioning .npz) are
        # gitignored instead, so this exclusion cannot be used to smuggle them in.
        exclude: ^experiments/results/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Generated artifacts whose provenance fields are high-entropy by design:
        # notebook outputs, the committed experiment results under
        # experiments/results/ (benchmark.json carries `git_sha`, calibration.json
        # carries `config_hash` -- both are recorded deliberately, and both are
        # regenerated with new values on every run, so a baseline entry cannot
        # hold), and the frozen numerical anchors under tests/fixtures/, whose
        # `provenance.sha` is the 40-hex commit the anchor was captured at. That
        # field is the whole point of the file -- it is what proves the anchor
        # predates the change it guards -- and it takes a new value on every
        # legitimate regeneration, so it has the same baseline problem.
        # None of these file types is a place credentials belong.
        exclude: ^(docs/tutorials/.*\.ipynb|experiments/results/.*|tests/fixtures/.*\.json)$

  - repo: local
    hooks:
      - id: ruff-check-all
        name: Ruff lint all files
        entry: bash .hooks/pre-push-ruff-check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format-check-all
        name: Ruff format check all files
        entry: bash .hooks/pre-push-ruff-format.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tests
        name: Run tests
        entry: bash .hooks/pre-push-tests.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
