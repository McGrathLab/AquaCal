# AquaCal -- E2 PRODUCTION RELEASE CONFIG for the frozen suite re-run (D-11).
#
# This is the config `run_experiment_suite.sh` reads as `E2_RELEASE_CONFIG`. The
# driver never calibrates from it directly: `emit_invocation_configs`
# (`experiments/e2_real_rig.py:1126`) generates the three invocation variants
# (classification / timing / memory) FROM this file, and each variant differs
# from it in exactly `paths.output_dir` and two `internals` keys (D-15, D-16).
#
# WHY THIS FILE EXISTS AT ALL (D-11, the F-001 shape)
# ---------------------------------------------------
# Until Phase 27 the release config lived at an absolute Windows path OUTSIDE
# the repository. The exact inputs of the run that produces the manuscript's
# Section 3 numbers therefore sat outside the artifact that claims to describe
# them -- provenance stored next to the run instead of inside it, which is the
# same shape as F-001. Committing it puts the inputs inside the frozen sha.
#
# THE THREE DECISIONS THIS FILE MAKES, AND WHY
# --------------------------------------------
# 1. ABSOLUTE PATHS, not relative.
#    `_preflight_frameset`'s probe resolves each declared extrinsic path with a
#    bare `pathlib.Path(p)` and then `.exists()`, i.e. against the DRIVER'S CWD
#    -- which under D-01/D-05 is the frozen clone, not the image-set root. The
#    calibration itself resolves the same way (`calibration/pipeline.py:249`
#    does `Path(v)` with no expansion of `~` or `$VARS`). The image set does NOT
#    live under the frozen clone on the run machine, so relative paths would
#    make pre-flight refuse with ABSENT and, if that were overridden, would make
#    the calibration fail on its first read. Absolute is the only form that
#    resolves in BOTH places without a library change.
#
#    The 26 paths below are the Linux run machine's, measured on 2026-08-19 and
#    recorded in `.planning/phases/27-frozen-single-sha-handoff-package/
#    27-TARGET-FACTS.md`. They embed the operator's home directory; that is
#    deliberate and is flagged for plan 27-10's pre-push audit, whose own plan
#    classifies "the target paths inside
#    experiments/configs/e2_release_linux.yaml" as INTENTIONAL AND REQUIRED. A
#    sanitised path that does not resolve on the target would be strictly worse
#    than a published directory name.
#
#    ON ANY OTHER MACHINE, do not edit this file: repoint the driver instead
#    with `SUITE_E2_RELEASE_CONFIG=<path to your config>`, or declare a
#    synthetic-only run with `--skip-e2`. That escape hatch is D-12's, and it is
#    what keeps the Git Bash development box -- where defects get diagnosed --
#    working unchanged.
#
# 2. IT LIVES IN `experiments/configs/`, a directory created for it.
#    `emit_invocation_configs` REFUSES to write when its target resolves to, or
#    inside, the source config's own directory (the release-tree write refusal,
#    T-19.5-07-01 / T-26-17). The default invocation target is
#    `experiments/results_e2_invocations`. With the source at
#    `experiments/configs/` that target is a SIBLING and the refusal correctly
#    stays quiet; had the config been placed at `experiments/` directly, the
#    default target would have been a CHILD of the source directory and the
#    refusal would fire on every run.
#
# 3. NO `internals:` BLOCK.
#    `build_internals_variant_config` (`e2_real_rig.py:1029`) CREATES the block
#    when the source has none (`:1066-1071`), and all three variants set
#    `log_all_observation_depths` and `benchmark_memory` themselves. A base
#    block would only be a fourth place for those two keys to disagree. What IS
#    required is a top-level `paths.output_dir` line -- the variant builder
#    raises without one -- so that line is kept, and each variant rewrites it.
#    `tests/unit/test_e2_release_config.py` asserts this by RUNNING the emitter,
#    not by assuming it.
#
# ON `frame_step: 1` -- NOT A DISCREPANCY (D-11, resolved by 27-01)
# -----------------------------------------------------------------
# The frames in this archive are ALREADY subsampled at every 30th video frame,
# so `detection.frame_step: 1` over these images is identical to
# `frame_step: 30` over the source video. The retired Desktop config's
# `frame_step: 30` is a config for VIDEO inputs; it is a different configuration
# addressing a different input kind, and it is NOT the one that produces the
# signature pre-flight asserts (13 x 262 extrinsic frames at `frame_step: 1` /
# `max_calibration_frames: 200`). The two were never in conflict.
#
# Expected runtime  : ~50 minutes on a modern desktop
# Expected peak RAM : ~11 GiB -- which is why E2's timing and memory stages are
#                     `serial_alone` in `experiments/suite_expectations.json`.

